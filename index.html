<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dữ liệu &amp; sao lưu · Chấm công &amp; Tính lương</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%230284c7%22%2F%3E%3Cpath%20d%3D%22M9%2010h14M9%2016h14M9%2022h9%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--p:#0284c7;--p-d:#0369a1;--p-50:#f0f9ff;--p-100:#e0f2fe;--ink:#082f49;--ink2:#0c4a6e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Be Vietnam Pro','Segoe UI',Roboto,Arial,sans-serif;font-size:14px;color:#1f2937;background:#f3f5f9;-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p-d)}
svg{flex:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* ===== Khung ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:250px;flex:none;background:linear-gradient(180deg,var(--ink),var(--ink2));color:#e5e7eb;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--p);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3);flex:none}
.brand .logo svg{width:22px;height:22px}
.brand b{display:block;font-size:15px;color:#fff;line-height:1.25}
.brand small{color:rgba(255,255,255,.55);font-size:12px}
.nav{flex:1;overflow:auto;padding:6px 10px 12px}
.nav-group{margin:16px 12px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.4);font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.78);text-decoration:none;cursor:pointer;font-weight:500;margin:2px 0;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--p);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.nav a svg{width:18px;height:18px;opacity:.9}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.save-state{font-size:12px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.save-state i{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:none}
.save-state.dirty i{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.btn-save{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border:0;border-radius:10px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;transition:.15s}
.btn-save:hover{background:var(--p-100)}
.btn-save svg{width:17px;height:17px}
.credit{font-size:11px;color:rgba(255,255,255,.38);margin-top:12px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(243,245,249,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid #e3e7ef;min-height:70px}
.topbar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.topbar p{margin:2px 0 0;color:#6b7280;font-size:13px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.content{padding:22px 28px 48px}
.menu-btn{display:none}
.backdrop{display:none}

/* ===== Nút, ô nhập ===== */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid #d6dce7;background:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:.15s;text-decoration:none;color:#1f2937}
.btn:hover{border-color:var(--p);color:var(--p-d)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:var(--p-d);border-color:var(--p-d);color:#fff}
.btn.xl{background:#107c41;border-color:#107c41;color:#fff}
.btn.xl:hover{background:#0b5e31;color:#fff}
.btn.danger{color:#dc2626;border-color:#fecaca}
.btn.danger:hover{background:#fef2f2;border-color:#dc2626;color:#b91c1c}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.on{background:var(--p-50);border-color:var(--p);color:var(--p-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{width:30px;height:30px;border-radius:8px;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:#667085;vertical-align:middle}
.ibtn svg{width:16px;height:16px}
.ibtn:hover{background:var(--p-50);color:var(--p-d)}
.ibtn.del:hover{background:#fee2e2;color:#dc2626}
.inp{height:36px;border:1px solid #d6dce7;border-radius:9px;padding:0 11px;background:#fff;outline:none;min-width:0;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-100)}
textarea.inp{height:auto;padding:9px 11px;min-height:76px;resize:vertical}
select.inp{padding-right:28px}
.inp.sm{height:30px;font-size:12.5px;border-radius:8px;padding:0 8px}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
.search{position:relative;display:inline-flex}
.search input{padding-left:34px;width:260px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#98a2b3}
.seg{display:inline-flex;background:#e9edf4;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:#475467}
.seg button.on{background:#fff;color:var(--p-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ===== Bố cục, thẻ ===== */
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cols-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.mt{margin-top:18px}.mb{margin-bottom:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:#667085}
.small{font-size:12.5px}
.r{text-align:right}.c{text-align:center}
.nowrap{white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}
.pos{color:#15803d}.neg{color:#dc2626}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:18px}
.kpi{background:#fff;border-radius:14px;padding:16px 18px;border:1px solid #e6e9f0;box-shadow:0 1px 2px rgba(16,24,40,.04);position:relative;overflow:hidden}
.kpi:after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--p-50);opacity:.6}
.kpi .k-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--p-50);color:var(--p);position:relative;z-index:1}
.kpi .k-ic svg{width:19px;height:19px}
.kpi .k-lb{color:#667085;font-size:12.5px;font-weight:500;margin-top:12px}
.kpi .k-v{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-sub{font-size:12px;color:#667085;margin-top:3px}
.t-green .k-ic{background:#dcfce7;color:#16a34a}
.t-red .k-ic{background:#fee2e2;color:#dc2626}
.t-amber .k-ic{background:#fef3c7;color:#d97706}
.t-blue .k-ic{background:#dbeafe;color:#2563eb}
.t-violet .k-ic{background:#ede9fe;color:#7c3aed}
.t-cyan .k-ic{background:#cffafe;color:#0891b2}
.card{background:#fff;border-radius:14px;border:1px solid #e6e9f0;box-shadow:0 1px 2px rgba(16,24,40,.04);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #eef0f5;min-height:56px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.card-h .sub{color:#667085;font-size:12.5px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.card-b.p0{padding:0}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--p-50);border:1px solid var(--p-100);margin-bottom:16px;flex-wrap:wrap}
.banner.warn{background:#fffbeb;border-color:#fde68a}
.banner svg{width:20px;height:20px;color:var(--p)}
.banner.warn svg{color:#d97706}
.empty{padding:40px 20px;text-align:center;color:#98a2b3}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#f2f4f7;color:#475467;white-space:nowrap}
.b-green{background:#dcfce7;color:#15803d}
.b-red{background:#fee2e2;color:#b91c1c}
.b-amber{background:#fef3c7;color:#b45309}
.b-blue{background:#dbeafe;color:#1d4ed8}
.b-violet{background:#ede9fe;color:#6d28d9}
.b-cyan{background:#cffafe;color:#0e7490}
.b-p{background:var(--p-50);color:var(--p-d)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:var(--p-100);color:var(--p-d);font-weight:700;font-size:12px;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{color:#667085;font-size:12px}

/* ===== Bảng ===== */
.tbl-card{background:#fff;border-radius:14px;border:1px solid #e6e9f0;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden}
.tbl-tools{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #eef0f5;flex-wrap:wrap}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 300px);min-height:200px}
.tbl-wrap.free{max-height:none}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:#f7f9fc;text-align:left;font-weight:700;color:#475467;padding:10px 12px;border-bottom:1px solid #e3e7ef;white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;z-index:2}
.tbl td{padding:9px 12px;border-bottom:1px solid #f0f2f6;vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl tbody tr:hover td{background:var(--p-50)}
.tbl tbody tr.click{cursor:pointer}
.tbl th.r,.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.c,.tbl td.c{text-align:center}
.tbl tfoot td{font-weight:700;background:#f7f9fc;border-top:2px solid #e3e7ef;position:sticky;bottom:0;z-index:2}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:after{content:'↕';opacity:.3;margin-left:5px}
.tbl th.asc:after{content:'↑';opacity:1}
.tbl th.desc:after{content:'↓';opacity:1}
.tbl td.act{white-space:nowrap;text-align:right;width:1%}
.tbl-pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12.5px;color:#667085;gap:10px;flex-wrap:wrap}
.tbl .inp.sm{width:110px}
.pg{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg select{margin:0 8px 0 4px}
.pg-n{min-width:30px;height:30px;padding:0 8px;border:1px solid #d6dce7;background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;color:#475467}
.pg-n:hover:not(:disabled){border-color:var(--p);color:var(--p-d)}
.pg-n.on{background:var(--p);border-color:var(--p);color:#fff}
.pg-n:disabled{opacity:.4;cursor:default}
.pg-dot{padding:0 4px;color:#98a2b3}
.pg-host .tbl-pager{border-top:1px solid #eef0f5}
.tbl.compact td{padding:7px 10px}
.tbl.compact th{padding:8px 10px}

/* ===== Modal, form ===== */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid #eef0f5}
.modal-h h3{margin:0;font-size:16px}
.modal-h .ibtn{margin-left:auto}
.modal-b{padding:18px 20px;max-height:72vh;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid #eef0f5;background:#fafbfc;border-radius:0 0 16px 16px}
.modal-f .left{margin-right:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:#344054}
.field.full{grid-column:1/-1}
.field.s2{grid-column:span 2}
.field small{color:#98a2b3;font-size:11.5px}
.field .inp{width:100%}
.field.chk{flex-direction:row;align-items:center;gap:8px}
.req{color:#ef4444;font-style:normal}
.fsec{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--p-d);border-bottom:1px solid #eef0f5;padding-bottom:6px;margin-top:6px}
.img-pick{display:flex;gap:12px;align-items:center}
.img-pick .ph{width:72px;height:72px;border-radius:12px;border:1px dashed #cbd2dd;display:grid;place-items:center;overflow:hidden;background:#f8fafc;color:#98a2b3;flex:none}
.img-pick .ph img{width:100%;height:100%;object-fit:contain}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f2f4f7;display:block}

/* ===== Thông báo, gợi ý ===== */
#toasts{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#111827;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;max-width:400px;animation:pop .2s;border-left:4px solid var(--p)}
.toast svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px;flex-shrink:0}
.toast.ok{border-left-color:#22c55e}
.toast.err{border-left-color:#ef4444}
#tip{position:fixed;pointer-events:none;background:#111827;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:400;white-space:pre;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25);line-height:1.4}

/* ===== Biểu đồ ===== */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#475467;margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut svg{width:170px;height:170px}
.dl{flex:1;min-width:170px}
.dl div{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #eef0f5;font-size:13px}
.dl div:last-child{border-bottom:0}
.dl i{width:10px;height:10px;border-radius:3px;flex:none}
.dl b{margin-left:auto;font-variant-numeric:tabular-nums}
.dl em{color:#98a2b3;font-style:normal;width:48px;text-align:right;font-size:12px}
.hb{margin:10px 0}
.hb-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}
.hb-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-bar{height:8px;background:#f0f2f6;border-radius:99px;overflow:hidden}
.hb-bar i{display:block;height:100%;border-radius:99px;background:var(--p)}
.funnel .fn{display:flex;align-items:center;gap:12px;margin:8px 0}
.funnel .fn-l{width:130px;font-size:13px;flex:none}
.funnel .fn-b{flex:1;height:30px;background:#f3f5f9;border-radius:8px;overflow:hidden}
.funnel .fn-b i{display:flex;align-items:center;height:100%;border-radius:8px;color:#fff;font-size:12px;font-weight:700;padding:0 10px;min-width:34px}

/* ===== Màn hình nhỏ ===== */
@media(max-width:1100px){.cols-2,.cols-3,.cols-21,.cols-12{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .sidebar{transform:none}
  body.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .menu-btn{display:inline-grid}
  .topbar{padding:10px 16px;flex-wrap:wrap;position:static}
  .top-actions{margin-left:0;width:100%;justify-content:flex-start}
  .content{padding:16px}
  .search input{width:200px}
  .form,.form.c3,.form.c4{grid-template-columns:minmax(0,1fr)}
  .field.s2{grid-column:auto}
}

/* ===== In ===== */
#print-root{display:none}
.pr{color:#111;font-size:12px;font-family:'Be Vietnam Pro','Segoe UI',Arial,sans-serif}
.pr-head{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--p);padding-bottom:10px;margin-bottom:12px}
.pr-head img{max-height:58px;max-width:120px}
.pr-co b{font-size:15px;color:var(--p-d);text-transform:uppercase}
.pr-co div{font-size:11.5px;color:#444}
.pr-meta{margin-left:auto;text-align:right;font-size:11px;color:#555}
.pr h2{text-align:center;margin:12px 0 4px;font-size:19px;text-transform:uppercase;color:#111;letter-spacing:.02em}
.pr .pr-sub{text-align:center;color:#555;margin-bottom:14px;font-style:italic}
.pr table{width:100%;border-collapse:collapse}
.pr th{background:var(--p);color:#fff;padding:6px;font-size:10.5px;border:1px solid var(--p-d);text-align:center}
.pr td{border:1px solid #c9ced8;padding:5px 6px;font-size:11px;vertical-align:top}
.pr td.r{text-align:right;white-space:nowrap}
.pr td.c{text-align:center}
.pr tfoot td{font-weight:700;background:#eef1f6}
.pr-signs{display:flex;justify-content:space-around;margin-top:26px;text-align:center;page-break-inside:avoid}
.pr-signs div{min-width:150px}
.pr-signs b{display:block}
.pr-signs i{font-size:11px;color:#666}
.pr-signs .sp{height:72px}
.pr-note{margin-top:10px;font-size:11.5px}
.pagebreak{page-break-after:always;break-after:page}
@media print{
  body{background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.is-printing>*:not(#print-root){display:none!important}
  body.is-printing #print-root{display:block}
  body:not(.is-printing) .sidebar,body:not(.is-printing) .topbar,body:not(.is-printing) .no-print{display:none!important}
  body:not(.is-printing) .content{padding:0}
  .card,.kpi,.tbl-card{box-shadow:none;break-inside:avoid}
  .tbl-wrap{max-height:none!important;overflow:visible!important}
  #print-root .card{border:1px solid #ddd}
  #print-root .kpis{grid-template-columns:repeat(3,1fr)}
  #print-root .cols-2,#print-root .cols-21,#print-root .cols-12{grid-template-columns:1fr 1fr}
  #print-root .no-print,#print-root .tbl-tools,#print-root .tbl-pager,#print-root td.act,#print-root th.act{display:none!important}
}

</style>
</head>

const Print = {
  run(html, { landscape = false, title } = {}) {
    $$('#print-root,#print-page').forEach(n => n.remove());
    const root = document.createElement('div'); root.id = 'print-root'; root.dataset.runtime = '1'; root.innerHTML = html;
    document.body.appendChild(root);
    const st = document.createElement('style'); st.id = 'print-page'; st.dataset.runtime = '1';
    st.textContent = `@page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:11mm 10mm}`;
    document.head.appendChild(st);
    document.body.classList.add('is-printing');
    const t0 = document.title; if (title) document.title = title;
    const done = () => { document.body.classList.remove('is-printing'); root.remove(); st.remove(); document.title = t0; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('is-printing')) done(); }, 800); }, 120);
  },
  head(meta = '') {
    const c = DB.settings.company || {};
    return `<div class="pr-head">${c.logo ? `<img src="${c.logo}">` : ''}<div class="pr-co"><b>${esc(c.ten || '')}</b>${c.diaChi ? `<div>${esc(c.diaChi)}</div>` : ''}<div>${[c.sdt ? 'ĐT: ' + esc(c.sdt) : '', c.email ? 'Email: ' + esc(c.email) : '', c.mst ? 'MST: ' + esc(c.mst) : ''].filter(Boolean).join(' · ')}</div></div><div class="pr-meta">${meta || 'Ngày in: ' + F.date(D.today())}</div></div>`;
  },
  signs(list, date = true) {
    const d = new Date();
    return `${date ? `<div style="text-align:right;margin-top:16px;font-style:italic">Ngày ${d.getDate()} tháng ${d.getMonth() + 1} năm ${d.getFullYear()}</div>` : ''}<div class="pr-signs">${list.map(s => `<div><b>${s}</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>`).join('')}</div>`;
  },
  table(cols, rows, totals = true) {
    const xc = xCols(cols);
    const body = rows.map((r, ri) => `<tr>${xc.map(c => { const v = c._c.xval ? c._c.xval(r) : colText(c._c, r); const t = c.type; return `<td class="${['money', 'num', 'pct'].includes(t) ? 'r' : t === 'date' || t === 'center' ? 'c' : ''}">${t === 'money' ? F.money(v) : t === 'num' ? F.num(v) : t === 'pct' ? F.pct(v) : t === 'date' ? F.date(v) : esc(v)}</td>`; }).join('')}</tr>`).join('');

  },
  view() {

    $$('input', v).forEach(i => { if (i.type !== 'checkbox') i.setAttribute('value', i.value); });

const Store = {
  handle: null, dirty: false, timer: null,

function emptyDB() { return { settings: defaultSettings(), employees: [], cham: {}, extra: {}, cv: [], kpi: {}, repairs: [], progress: [] }; }
function sampleDB() {

  const plan = [
    ['Ban Giám đốc', 'Giám đốc', 45e6, 5e6, 0], ['Ban Giám đốc', 'Phó Giám đốc', 35e6, 3e6, 1],

    ['Kinh doanh', 'Trưởng phòng KD', 25e6, 3e6, 0], ['Kinh doanh', 'Nhân viên KD', 10e6, 1e6, 0], ['Kinh doanh', 'Nhân viên KD', 10e6, 1e6, 1], ['Kinh doanh', 'Nhân viên KD', 9.5e6, 1e6, 0], ['Kinh doanh', 'Nhân viên KD', 9.5e6, 1e6, 1],
    ['Nhân sự', 'Trưởng phòng NS', 20e6, 2e6, 1], ['Nhân sự', 'Chuyên viên tuyển dụng', 11e6, 5e5, 1],
    ['Kho vận', 'Thủ kho', 10e6, 1e6, 0], ['Kho vận', 'Nhân viên kho', 8e6, 5e5, 0], ['Kho vận', 'Tài xế giao hàng', 8.5e6, 1e6, 0],
    ['Sản xuất', 'Tổ trưởng sản xuất', 12e6, 1e6, 0], ['Sản xuất', 'Công nhân', 7.5e6, 3e5, 1], ['Sản xuất', 'Công nhân', 7.5e6, 3e5, 0]
  ];
  const junior = [['Kinh doanh', 'Nhân viên KD', 9e6, 1e6], ['Sản xuất', 'Công nhân', 7.2e6, 3e5], ['Kho vận', 'Nhân viên kho', 7.8e6, 5e5], ['Kế toán', 'Kế toán viên', 10e6, 5e5], ['Sản xuất', 'Công nhân', 7.5e6, 3e5], ['Kinh doanh', 'Chăm sóc khách hàng', 8.5e6, 5e5]];
  for (let i = 0; i < 22; i++) { const j = junior[i % junior.length]; plan.push([j[0], j[1], j[2] + Sample.int(r, 0, 10) * 1e5, j[3], r() < .5 ? 1 : 0]); }
  const nows = D.ymNow();
  plan.forEach((p, i) => {

    });

  const today = D.today();
  D.ymRange(nows, 7).forEach(ym => {
    db.cham[ym] = {}; db.extra[ym] = {};
    const n = D.daysIn(ym);
    db.employees.forEach(e => {
      const d = {};
      for (let k = 1; k <= n; k++) {
        const ds = ym + '-' + pad(k); if (ds > today) break;
        if (D.dow(ym, k) === 0) continue;
        if (ym.endsWith('-09') && (k === 1 || k === 2)) { d[k] = 'L'; continue; }
        const x = r(); d[k] = x < .02 ? 'KP' : x < .05 ? 'P' : x < .065 ? 'O' : x < .09 ? 'N' : x < .12 && e.phongBan === 'Kinh doanh' ? 'CT' : 'X';

  return db;
}
function migrate(db) {
  db.settings = Object.assign(defaultSettings(), db.settings || {});
  db.settings.company = Object.assign(defaultSettings().company, db.settings.company || {});
  db.cv = db.cv || []; db.kpi = db.kpi || {}; db.employees = db.employees || []; db.cham = db.cham || {}; db.extra = db.extra || {};
  db.repairs = db.repairs || []; db.progress = db.progress || [];
  db.cv.forEach(j => { if (!j.ky && j.th) j.ky = String(j.th).slice(0, 7); if (!j.kv && j.tt) j.kv = impKv(j.tt); if (j.sl == null) j.sl = 1; if (j.dk == null) j.dk = 1; });
  db.repairs.forEach(r => {
    if (!r.ngay && r.thang) r.ngay = String(new Date().getFullYear()) + '-' + pad(+r.thang) + '-01';
    if (!r.ky && r.ngay) r.ky = String(r.ngay).slice(0, 7);
    if (!r.thang && r.ky) r.thang = +r.ky.slice(5);
    if (!r.kq) r.kq = 'Chưa cập nhật';
    if (!r.kv && r.tt) r.kv = impKv(r.tt);
  });
  db.progress.forEach(p => {
    if (!p.ngay && p.ky) p.ngay = p.ky + '-01';
    if (!p.ky && p.ngay) p.ky = String(p.ngay).slice(0, 7);
    if (!p.tt) p.tt = 'Chưa hoàn thành';
    if (!p.w && p.ngay) p.w = Math.ceil(+String(p.ngay).slice(8, 10) / 7) || 0;
    if (p.tuan == null) p.tuan = p.w || 0;
    if (!p.id) p.id = uid();
  });
}

const S = () => DB.settings;
const empById = id => DB.employees.find(e => e.id === id);
function att(ym, eid) { DB.cham[ym] = DB.cham[ym] || {}; return DB.cham[ym][eid] = DB.cham[ym][eid] || { d: {}, ot: 0 }; }
function summarize(ym, eid) {
  const a = (DB.cham[ym] || {})[eid] || { d: {}, ot: 0 };
  const o = { lv: 0, hl: 0, kl: 0, P: 0, L: 0, O: 0, KP: 0, ot: +a.ot || 0, has: Object.keys(a.d).length > 0 };
  for (const k in a.d) { const c = CODES[a.d[k]]; if (!c) continue; o.lv += c.lv; o.hl += c.hl; o.kl += c.kl; if (o[a.d[k]] !== undefined) o[a.d[k]]++; }
  return o;
}
function taxOf(tn) {
  let t = 0, prev = 0;
  for (const b of S().bac) {
    const top = +b.den || Infinity;
    if (tn <= prev) break;
    t += (Math.min(tn, top) - prev) * (+b.ts || 0) / 100; prev = top;
  }
  return Math.round(t);

const nh = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]/g, '');
function eNum(v) { if (typeof v === 'number') return Math.round(v); const s = String(v ?? '').trim(); if (!s) return 0; if (/^-?\d+[.,]\d{1,2}$/.test(s)) return Math.round(parseFloat(s.replace(',', '.'))); return F.parse(s); }
function eDate(v) {
  if (v === '' || v == null) return '';
  if (typeof v === 'number' && v > 59) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return d.toISOString().slice(0, 10); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  if (/^\d{4}$/.test(s)) return s + '-01-01';
  return '';
}
function eText(k, v) {

  if (k === 'sdt' && /^[1-9]\d{8}$/.test(s)) s = '0' + s;          // Excel làm mất số 0 đầu
  if (k === 'cccd' && /^\d{11}$/.test(s)) s = '0' + s;
  return s;
}
function empParse(rows, fromPaste) {
  rows = rows.filter(r => r && r.some(c => String(c ?? '').trim() !== ''));
  let hr = -1, map = {};
  for (let r = 0; r < Math.min(rows.length, 20) && hr < 0; r++) {
    const m = {};
    rows[r].forEach((h, i) => { const n = nh(h); const c = EIMP.find(c => c.alias.includes(n)); if (c && m[c.key] === undefined) m[c.key] = i; });
    if (m.ten !== undefined) { hr = r; map = m; }
  }
  if (hr < 0) { if (!fromPaste) throw new Error('Không thấy cột "Họ và tên" trong file. Tải file mẫu về để điền cho đúng nhé'); EIMP.forEach((c, i) => map[c.key] = i); }
  const out = [], seen = new Set(); let auto = 0;
  DB.employees.forEach(e => { const n = parseInt(String(e.ma).replace(/\D/g, '')) || 0; if (n > auto) auto = n; });
  const nextMa = () => { let m; do m = 'NV' + String(++auto).padStart(3, '0'); while (DB.employees.some(e => e.ma === m) || seen.has(m)); return m; };
  rows.slice(hr + 1).forEach((r, k) => {
    const g = key => map[key] === undefined ? '' : r[map[key]];
    const ten = String(g('ten') ?? '').trim(); if (!ten) return;
    const o = { dong: hr + k + 2, has: {} };
    EIMP.forEach(c => {
      const v = g(c.key); o.has[c.key] = map[c.key] !== undefined && String(v ?? '').trim() !== '';
      o[c.key] = c.t === 'money' || c.t === 'int' ? eNum(v) : c.t === 'date' ? eDate(v) : eText(c.key, v);
    });
    o.ten = ten;
    const gt = nh(o.gioiTinh); o.gioiTinh = gt.startsWith('nu') || gt === 'f' ? 'Nữ' : 'Nam';
    const tt = nh(o.trangThai); o.trangThai = tt.includes('thu') ? 'Thử việc' : tt.includes('nghi') ? 'Nghỉ việc' : 'Đang làm';
    o.ma = String(o.ma || '').toUpperCase(); if (!o.ma) o.ma = nextMa();
    if (!o.has.luongBH) o.luongBH = o.luongCB;
    if (seen.has(o.ma)) { o.tt = 'trung'; } else { seen.add(o.ma); o.cu = DB.employees.find(e => e.ma === o.ma); o.tt = o.cu ? 'cu' : 'moi'; }
    out.push(o);
  });
  return out;
}

/* --- KPI công việc --- */
function kpiCalc(ky) {
  const js = cvOf(ky), ppl = [...new Set([...js.flatMap(jNames), ...Object.keys((DB.kpi || {})[ky] || {})])], totKl = sum(js, klOf);
  return ppl.map(p => {
    const mine = js.filter(j => jNames(j).includes(p)), n = mine.length, kl = sum(mine, j => klOf(j) / jNames(j).length), c = f => mine.filter(f).length;
    const m = { p, n, kl, share: totKl ? kl / totKl : 0, ll: c(j => j.ll), cd: c(j => j.cd), tn: c(j => j.tn), vp: c(j => j.vp), cp: sum(mine, j => j.cp) };
    m.llR = n ? m.ll / n : 0; m.cdR = n ? m.cd / n : 0; m.self = n ? (n - m.tn) / n : 0;
    const a = { kl: m.share >= .7 ? 20 : m.share >= .6 ? 15 : m.share >= .5 ? 10 : 0, cl: m.llR <= .05 ? 20 : m.llR <= .1 ? 15 : 10, tg: 10, bc: 5, kn: m.self >= .95 ? 20 : 15, ph: 10, cd: m.cdR >= .2 ? 10 : m.cdR >= .15 ? 5 : m.cdR >= .1 ? 1 : 0, kt: Math.max(0, 5 - m.vp) };
    const ov = (((DB.kpi || {})[ky] || {})[p]) || {}; m.auto = a; m.ov = ov; m.sc = {}; CRIT.forEach(([k]) => m.sc[k] = ov[k] ?? a[k]); m.tot = sum(CRIT, x => m.sc[x[0]]);
    const e = empOf(p), s = e && summarize(ky, e.id); m.cong = s ? s.lv : null; m.nsuat = s && s.lv ? kl / s.lv : null; return m;
  }).sort((a, b) => b.tot - a.tot);
}

  },

.imp-map-field .inp{width:100%;height:31px;font-size:12px}

.imp-opt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.imp-radio,.imp-check{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid #eef0f5;border-radius:10px;cursor:pointer;transition:.12s}
.imp-radio:hover,.imp-check:hover{background:#fafbfc;border-color:#dbe4ef}
.imp-radio input,.imp-check input{margin-top:3px;flex:0 0 auto}
.imp-radio b,.imp-check b{display:block;font-size:12.5px}
.imp-radio small,.imp-check small{color:#667085;font-size:11.5px;line-height:1.5;display:block}
.imp-year{display:flex;align-items:center;gap:8px;padding:10px 11px;border:1px solid #eef0f5;border-radius:10px;flex-wrap:wrap}
.imp-year small{color:#98a2b3;font-size:11px}
.imp-year .inp{width:78px;height:31px}
.imp-months{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed #eef0f5}
.imp-stats{display:flex;gap:6px;flex-wrap:wrap}
.imp-stat{padding:6px 12px;border-radius:10px;background:#f8fafc;border:1px solid #eef0f5;text-align:center;min-width:74px}
.imp-stat small{display:block;font-size:10.5px;color:#667085}
.imp-stat b{font-size:17px}
.imp-stat.s-new b{color:#15803d}.imp-stat.s-upd b{color:#b45309}.imp-stat.s-skip b{color:#667085}.imp-stat.s-err b{color:#b91c1c}

.imp-warnbox.err{border-color:#fecaca;background:#fff7f7}
.imp-warnbox summary{cursor:pointer;font-size:12px;font-weight:600;color:#475467;display:flex;gap:7px;align-items:center}
.imp-warnbox.err summary{color:#b91c1c}
.imp-warn-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto}
.imp-warn-list>div{font-size:11.5px;padding:6px 8px;border-radius:7px;background:#fafbfc}
.imp-warn-list b{display:block;color:#475467}
.imp-warn-list span{color:#98a2b3}
.imp-score{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #bae6fd;border-radius:11px;background:#f0f9ff;margin-top:10px}
.imp-score-ic{color:#0284c7;flex:0 0 auto}
.imp-score b{font-size:12.5px;display:block}
.imp-score small{color:#667085;font-size:11.5px;display:block;line-height:1.5}
.imp-prev .tbl-wrap{max-height:430px}
.imp-prev .tbl-pager{padding:8px 12px}
.imp-st-cell{display:flex;flex-direction:column;gap:2px;min-width:130px}
.imp-st-cell small{font-size:10.5px;line-height:1.3}
.imp-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px;color:#98a2b3;text-align:center}
.imp-empty b{color:#475467;font-size:13px}
.imp-empty span{font-size:11.5px}
.imp-success{text-align:center;padding:14px 10px 4px}
.imp-success-ic{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:#15803d;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}

.imp-success h2{margin:0 0 4px;font-size:20px}
.imp-success-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:500px;margin:16px auto}
.imp-success-grid>div{padding:10px;border-radius:11px;background:#f8fafc;border:1px solid #eef0f5}
.imp-success-grid small{display:block;color:#667085;font-size:11px}
.imp-success-grid b{font-size:22px}
.imp-success-months{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0}
.imp-success .banner{text-align:left}
.imp-success .imp-score{text-align:left}
.pos{color:#15803d}.neg{color:#b91c1c}
@media(max-width:960px){
 .imp-layout{grid-template-columns:1fr}
 .imp-map-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

 .imp-opt{grid-template-columns:1fr}
}

 .imp-steps span{padding:6px 10px;font-size:11.5px}
 .imp-map-grid{grid-template-columns:1fr}
 .imp-success-grid{grid-template-columns:repeat(2,1fr)}
}

}

  }).join('');
}
function impMappingHTML(st) {

  const sample = (i, key) => {
    for (let r = s.hr + 1; r < Math.min(s.rows.length, s.hr + 10); r++) {
      const raw = (s.rows[r] || [])[i], v = impClean(raw);
      if (!v) continue;
      if (['th', 'ngay', 'nn', 'ht', 'bc', 'ngayXl'].includes(key)) {

      <button class="btn sm" data-imp-automap>${ic('refresh')} Nhận diện lại</button>
      ${same ? `<button class="btn sm" data-imp-applymap>${ic('copy')} Áp dụng cho ${same} sheet cùng mẫu</button>` : ''}</div>
      <div class="row" style="width:100%;gap:6px">${selectHTML('impMapSheet', st.sheets.filter(x => st.sel.has(x.idx) && x.hr >= 0).map(x => ({ value: x.idx, label: x.name })), st.mapIdx, 'sm')}<span class="badge ${s.ok ? 'b-green' : 'b-amber'}">${s.ok ? 'Đủ cột bắt buộc' : esc(s.why)}</span></div>
    </div>
    <div class="imp-map-grid">${cfg.defs.map(d => {

    }).join('')}</div>
    ${st.kind === 'sc' ? `<div class="small muted" style="padding:0 18px 14px">Có thể dùng cột <b>Ngày</b> hoặc chỉ cột <b>Tháng</b>. Nếu file chỉ có tháng, hệ thống lấy ngày 01 để tính kỳ.</div>` : ''}
    ${st.kind === 'progress' ? `<div class="small muted" style="padding:0 18px 14px">Cần cột <b>Tên công việc</b> và <b>Ngày</b>. Cột Tuần, Trạng thái, Người phụ trách, Nhóm/dự án là tuỳ chọn. Trạng thái được chuẩn hoá thành Hoàn thành / Đang thực hiện / Chưa hoàn thành.</div>` : ''}
  </div>`;
}
function impOptionsHTML(st) {

      ${st.kind === 'kpi' && st.score && st.score.blocks.length ? `<label class="imp-check"><input type="checkbox" data-imp-scores ${st.syncScores ? 'checked' : ''}><span><b>Đồng bộ bảng điểm KPI tháng</b><small>Đọc ${st.score.blocks.length} điểm của ${new Set(st.score.blocks.map(b => b.p)).size} nhân sự từ sheet “${esc(st.score.sheetName)}”.</small></span></label>` : ''}
      <label class="imp-check"><input type="checkbox" data-imp-cfg ${st.addCfg ? 'checked' : ''}><span><b>Bổ sung danh mục</b><small>Tự thêm trung tâm, hạng mục, người báo, nhân sự mới vào danh mục để lần sau chọn nhanh.</small></span></label>
      <div class="imp-year"><span>Năm cho ngày thiếu năm</span><input class="inp sm" type="number" min="2000" max="2100" value="${st.year}" data-imp-year><small>Dùng khi file ghi ngày dạng 15/03 hoặc chỉ có tháng.</small></div>
    </div>
    <div class="imp-months"><span class="small muted">Dữ liệu sẽ ghi:</span>${chip}</div>
  </div>`;
}
function impPreviewHTML(st) {
  const sm = st.summary || { add: 0, update: 0, skip: 0, dup: 0, error: 0, action: 0 };
  const warnRows = (g, cls) => `<details class="imp-warnbox ${cls}"><summary>${ic('alert')} ${g.length} nhóm cảnh báo <span class="muted">(bấm để xem)</span></summary><div class="imp-warn-list">${g.slice(0, 20).map(x => `<div><b>${esc(x.msg)}</b><span>${x.rows.length} dòng · ${esc(x.rows.slice(0, 3).join(', '))}${x.rows.length > 3 ? '…' : ''}</span></div>`).join('')}${g.length > 20 ? `<div class="muted">Còn ${g.length - 20} nhóm khác...</div>` : ''}</div></details>`;
  return `<div class="imp-card mt">
    <div class="imp-prev-head"><div><h4>${ic('eye')} Xem trước dữ liệu</h4><small>Kiểm tra kỹ trước khi ghi. Bạn có thể bỏ chọn sheet hoặc sửa ánh xạ cột ở trên.</small></div><div class="imp-stats">
      <div class="imp-stat s-new"><small>Thêm mới</small><b>${sm.add}</b></div><div class="imp-stat s-upd"><small>Cập nhật</small><b>${sm.update}</b></div>
      <div class="imp-stat s-skip"><small>Bỏ qua</small><b>${sm.skip + sm.dup}</b></div><div class="imp-stat s-err"><small>Lỗi</small><b>${sm.error}</b></div>

    ${st.errGroups.length ? warnRows(st.errGroups, 'err') : ''}
    ${st.warnGroups.length ? warnRows(st.warnGroups, '') : ''}
    ${st.kind === 'kpi' && st.score && st.score.blocks.length ? `<div class="imp-score"><span class="imp-score-ic">${ic('trend')}</span><div class="grow"><b>Bảng điểm KPI tháng đã được nhận diện</b><small>${st.score.blocks.length} điểm · ${[...new Set(st.score.blocks.map(b => b.p))].join(', ')} · ${[...new Set(st.score.blocks.map(b => F.month(b.ky)))].join(', ')} ${st.syncScores ? '· sẽ đồng bộ' : '· chưa chọn đồng bộ'}</small>${st.score.warnings.length ? `<div class="small neg">${esc(st.score.warnings.slice(0, 2).join(' · '))}${st.score.warnings.length > 2 ? '…' : ''}</div>` : ''}</div></div>` : ''}
    <div id="impPrev" class="imp-prev"></div>
  </div>`;
}
function impMainHTML(st) {
  if (st.busy) return impSteps(st) + impFileBar(st) + `<div class="card mt"><div class="imp-loading"><div class="imp-spin"></div><b>Đang đọc dữ liệu...</b><div class="small muted">${esc(st.fileName)} · ${impFmtBytes(st.fileSize)}</div><div class="small muted">Bỏ qua hình ảnh nhúng để đọc nhanh và không làm nặng file.</div></div></div>`;
  const cfg = IMP_KINDS[st.kind];
  return `${impSteps(st)}${impFileBar(st)}${st.err ? `<div class="banner warn mt">${ic('alert')}<div class="grow">${esc(st.err)}</div></div>` : ''}
    <div class="imp-layout mt"><div class="imp-card"><div class="card-h" style="padding:0 0 10px;border:0"><h3>${ic('sheet')} Chọn sheet dữ liệu</h3><span class="sub">${st.sel.size}/${st.sheets.length} sheet được chọn</span></div><div class="imp-sheets">${impSheetListHTML(st)}</div><div class="small muted" style="margin-top:8px">Mặc định chỉ chọn sheet có dữ liệu mới, tự bỏ các sheet trùng lặp. Bạn vẫn có thể chọn thêm.</div></div>
    ${impOptionsHTML(st)}</div>
    ${impMappingHTML(st)}
    ${impPreviewHTML(st)}`;

function impSetFoot(st, m) {
  const f = m.el.querySelector('.modal-f'); if (!f) return;
  if (st.result) {
    f.innerHTML = `<span class="left small muted">Dữ liệu đã cập nhật trong bộ nhớ. Bấm “Lưu vào file” ở góc trái để ghi vào file HTML.</span><button class="btn danger" data-imp-undo>${ic('refresh')} Hoàn tác</button><button class="btn pri" data-imp-close>${ic('check')} Đóng</button>`;
  } else if (!st.file) {
    f.innerHTML = `<span class="left small muted">Hỗ trợ .xlsx, .xlsm, .csv · tối đa nhiều sheet</span><button class="btn" data-imp-close>Hủy</button>`;
  } else {
    const n = st.summary ? st.summary.action : 0;
    f.innerHTML = `<span class="left small muted">${st.summary ? `${st.summary.add} thêm mới · ${st.summary.update} cập nhật · ${st.summary.skip + st.summary.dup} bỏ qua · ${st.summary.error} lỗi` : 'Đang phân tích...'}</span><button class="btn" data-imp-other>${ic('upload')} Chọn file khác</button><button class="btn" data-imp-close>Hủy</button><button class="btn pri" data-imp-apply ${!n || st.busy ? 'disabled' : ''}>${ic('check')} Nhập ${n || ''} ${n ? cfgNoun(st) : ''}</button>`;
  }
  f.querySelectorAll('[data-imp-close]').forEach(b => b.onclick = () => m.close());
  f.querySelectorAll('[data-imp-undo]').forEach(b => b.onclick = () => impUndo(st, m));
  f.querySelectorAll('[data-imp-other]').forEach(b => b.onclick = () => {
    const inp = m.body.querySelector('[data-imp-file]');
    if (inp) { inp.value = ''; inp.click(); } else impReset(st, m);
  });
  f.querySelectorAll('[data-imp-apply]').forEach(b => b.onclick = () => impApply(st, m));
}
function cfgNoun(st) { return st.kind === 'kpi' ? 'báo cáo' : st.kind === 'progress' ? 'công việc' : 'hạng mục'; }
function impBind(st, m) {
  m.body.querySelectorAll('[data-imp-file]').forEach(inp => inp.onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if (f) impReadFile(st, m, f);
  });
  const dz = m.body.querySelector('[data-imp-drop]');
  if (dz) {
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) impReadFile(st, m, f); });
    dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const inp = dz.querySelector('[data-imp-file]'); if (inp) inp.click(); } });
    dz.tabIndex = 0;
  }
  m.body.querySelectorAll('[data-imp-sheet]').forEach(cb => cb.onchange = () => {
    const i = +cb.dataset.impSheet;
    if (cb.checked) st.sel.add(i); else st.sel.delete(i);
    impDraw(st, m, true);
  });
  m.body.querySelectorAll('[data-imp-map]').forEach(sel => sel.onchange = () => {
    const s = st.sheets.find(x => x.idx === st.mapIdx); if (!s) return;
    if (sel.value === '') delete s.map[sel.dataset.impMap]; else s.map[sel.dataset.impMap] = +sel.value;
    impSheetParse(st, s); impDraw(st, m, true);
  });
  const hs = m.body.querySelector('[data-imp-header]');
  if (hs) hs.onchange = () => {
    const s = st.sheets.find(x => x.idx === st.mapIdx); if (!s) return;
    const hr = Math.max(0, Math.min(s.rows.length - 1, (+hs.value || 1) - 1));
    s.hr = hr; s.map = impAutoMap(s.rows[hr] || [], IMP_KINDS[st.kind].defs); s.headers = impHeaders(s); s.sig = (s.rows[hr] || []).map(impNorm).join('|');
    impSheetParse(st, s); impDraw(st, m, true);
  };
  const am = m.body.querySelector('[data-imp-automap]');
  if (am) am.onclick = () => {
    const s = st.sheets.find(x => x.idx === st.mapIdx); if (!s) return;
    s.map = impAutoMap(s.rows[s.hr] || [], IMP_KINDS[st.kind].defs); impSheetParse(st, s); impDraw(st, m, true);
  };
  const ap = m.body.querySelector('[data-imp-applymap]');
  if (ap) ap.onclick = () => {
    const s = st.sheets.find(x => x.idx === st.mapIdx); if (!s) return;
    st.sheets.forEach(o => { if (o !== s && o.sig && o.sig === s.sig) { o.hr = s.hr; o.map = { ...s.map }; o.headers = s.headers.length ? s.headers : impHeaders(o); impSheetParse(st, o); } });
    toast(`Đã áp dụng ánh xạ cho các sheet cùng mẫu`, 'ok'); impDraw(st, m, true);
  };
  m.body.querySelectorAll('[data-imp-replace]').forEach(x => x.onchange = () => { st.replace = x.checked; impDraw(st, m, true); });
  m.body.querySelectorAll('[data-imp-scores]').forEach(x => x.onchange = () => { st.syncScores = x.checked; impDraw(st, m, true); });
  m.body.querySelectorAll('[data-imp-cfg]').forEach(x => x.onchange = () => { st.addCfg = x.checked; impDraw(st, m, true); });
  m.body.querySelectorAll('[data-imp-year]').forEach(x => x.onchange = () => {
    st.year = x.value || String(new Date().getFullYear());
    st.sheets.forEach(s => impSheetParse(st, s)); impDraw(st, m, true);
  });
  m.body.querySelectorAll('[name="impMode_' + st.kind + '"]').forEach(r => r.onchange = () => { st.mode = r.value; impDraw(st, m, true); });
  const ms = m.body.querySelector('#impMapSheet');
  if (ms) ms.onchange = () => { st.mapIdx = +ms.value; impDraw(st, m, true); };
  m.body.querySelectorAll('[data-imp-tpl]').forEach(b => b.onclick = () => impTemplate(st.kind));
  m.body.querySelectorAll('[data-imp-errx]').forEach(b => b.onclick = () => { st.err = ''; impDraw(st, m); });
  m.body.querySelectorAll('[data-imp-new]').forEach(b => b.onclick = () => {
    impReset(st, m);
    const inp = m.body.querySelector('[data-imp-file]');
    if (inp) inp.click();
  });
  const prev = m.body.querySelector('#impPrev');
  if (prev && st.items && st.items.length) {
    if (st.kind === 'kpi') impPreviewTable(prev, st);
    else impPreviewTable(prev, st);
  } else if (prev) {
    prev.innerHTML = `<div class="imp-empty">${ic('search')}<b>Chưa có dòng dữ liệu để xem trước</b><span>Chọn sheet, kiểm tra dòng tiêu đề và ánh xạ đủ các cột bắt buộc.</span></div>`;
  }
}
function impPreviewTable(el, st) {

    return `<div class="imp-st-cell">${impBadge(it._st)}<small class="${it._st === 'error' ? 'neg' : 'muted'}" title="${esc(reason)}">${esc(reason.length > 44 ? reason.slice(0, 44) + '…' : (reason || it.sheet + ' · dòng ' + it.srcRow))}</small></div>`;
  };

    { key: 'ng', label: 'Người xử lý' }, { key: 'sl', label: 'SL', fmt: 'num', align: 'r' }, { key: 'kl', label: 'Khối lượng', fmt: 'num', align: 'r', val: it => (+it.hs || hsOf(it.sl)) * (+it.dk || 1) },

function impApply(st, m) {
  if (!st.summary || !st.summary.action) return;
  const cfg = IMP_KINDS[st.kind], coll = impArr(st.kind);
  const snapshot = { cv: clone(DB.cv || []), repairs: clone(DB.repairs || []), kpi: clone(DB.kpi || {}), cvCfg: clone((DB.settings && DB.settings.cvCfg) || {}), progress: clone(DB.progress || []) };
  const months = st.months.slice();
  let added = 0, updated = 0, skipped = 0, scores = 0;
  try {
    if (st.replace) {
      const ms = new Set(months);
      if (st.kind === 'kpi') {
        DB.cv = (DB.cv || []).filter(r => !ms.has(r.ky));
        DB.kpi = DB.kpi || {};
        months.forEach(ky => { delete DB.kpi[ky]; });
      } else if (st.kind === 'progress') {
        DB.progress = (DB.progress || []).filter(r => !ms.has(r.ky));
      } else {
        DB.repairs = (DB.repairs || []).filter(r => !ms.has(r.ky));
      }
    }
    const arr = impArr(st.kind);
    const pool = new Map();
    arr.forEach(r => {
      const fp = cfg.fp(r);
      if (!pool.has(fp)) pool.set(fp, []);
      pool.get(fp).push(r);
    });
    const clean = it => {
      const { _err, _warn, _st, _dup, _fp, sheet, srcRow, ...rest } = it;
      rest.ky = rest.th ? rest.th.slice(0, 7) : rest.ky;
      rest.ky = rest.ky || (rest.ngay || '').slice(0, 7);
      if (st.kind !== 'progress') rest.kv = impKv(rest.tt);
      if (st.kind === 'sc') { rest.thang = +rest.thang || +(rest.ngay || '').slice(5, 7) || 0; rest.sl = +rest.sl || 0; }
      else if (st.kind === 'progress') { rest.tuan = +rest.tuan || 0; rest.w = rest.w || Math.ceil(+String(rest.ngay || '').slice(8, 10) / 7) || 0; }
      else { rest.sl = +rest.sl || 1; rest.dk = +rest.dk || 1; rest.hs = +rest.hs || hsOf(rest.sl); }
      return rest;
    };
    st.items.forEach(it => {
      if (it._st !== 'new' && it._st !== 'update' && it._st !== 'skip') return;
      if (it._err.length || it._dup) return;
      const fp = cfg.fp(it), data = clean(it);
      const q = pool.get(fp);
      if (q && q.length) {
        if (st.mode === 'skip') { skipped++; return; }
        const old = q.shift();
        Object.assign(old, data, { id: old.id });
        updated++;
      } else {
        const row = { id: uid(), ...data };
        arr.push(row);
        if (!pool.has(fp)) pool.set(fp, []);
        pool.get(fp).push(row);
        added++;
      }
    });
    if (st.addCfg) {
      const imported = st.items.filter(it => (it._st === 'new' || it._st === 'update') && !it._err.length);
      impEnsureCfg(st.kind, imported);
    }
    if (st.kind === 'kpi' && st.syncScores && st.score && st.score.blocks.length) {
      DB.kpi = DB.kpi || {};
      st.score.blocks.forEach(b => {
        DB.kpi[b.ky] = DB.kpi[b.ky] || {};
        DB.kpi[b.ky][b.p] = Object.assign({ note: 'Đồng bộ từ sheet ' + st.score.sheetName }, b.scores);
        scores++;
      });
    }
    if (months.length) {
      const latest = months[months.length - 1];
      if (st.kind === 'kpi') { UI.cvm = latest; UI.kvm = latest; }
      else if (st.kind === 'progress') UI.pgm = pgDefaultMonth();
      else UI.scm = latest;
    }
    st.result = { add: added, update: updated, skip: skipped, dup: st.summary.dup, error: st.summary.error, months, scores };
    st.snapshot = snapshot;
    App.changed();
    impDraw(st, m, false);
    toast(`Đã nhập <b>${added + updated}</b> ${cfg.noun}. Nhớ bấm “Lưu vào file”.`, 'ok', 5000);
  } catch (e) {
    console.error(e);
    DB.cv = snapshot.cv; DB.repairs = snapshot.repairs; DB.kpi = snapshot.kpi; DB.settings.cvCfg = snapshot.cvCfg; DB.progress = snapshot.progress;
    st.result = null; st.snapshot = null;
    toast('Nhập dữ liệu bị lỗi, đã khôi phục trạng thái trước đó: ' + esc(e.message || e), 'err', 6000);
    impDraw(st, m, false);
  }
}

  if (P.open) alerts.push({ tone: '', icon: 'calcheck', title: `${P.open} công việc tiến độ chưa hoàn thành`, sub: `${F.month(pm)} · đã xong ${P.done}/${P.total} việc (${F.pct(P.rate)})`, go: 'pg' });
  const unassigned = P.list.filter(p => !p.nguoi).length;
  if (unassigned) alerts.push({ tone: 'info', icon: 'users', title: `${unassigned}/${P.total} công việc tiến độ chưa phân công`, sub: 'Bổ sung người phụ trách để theo dõi trách nhiệm rõ hơn', go: 'pg' });
  if (!K.flags.ll && !K.flags.vp) alerts.push({ tone: 'ok', icon: 'shield', title: 'Không ghi nhận lỗi lặp lại hoặc vi phạm KPI', sub: `${F.month(km)} · ${K.js.length} công việc đã ghi nhận`, go: 'kpi' });
  else if (K.flags.ll) alerts.push({ tone: 'bad', icon: 'alert', title: `${K.flags.ll} công việc có lỗi lặp lại`, sub: `Chiếm ${F.pct(K.llRate)} số việc trong kỳ`, go: 'kpi' });
  if (!K.flags.tn && !K.cp) alerts.push({ tone: 'ok', icon: 'money', title: 'Không phát sinh chi phí / thuê ngoài trong KPI', sub: `${F.month(km)} · kiểm soát chi phí tốt`, go: 'kpi' });
  if (!alerts.length) alerts.push({ tone: 'ok', icon: 'check', title: 'Không có cảnh báo vận hành', sub: 'Các chỉ số đang trong ngưỡng an toàn', go: 'kpi' });

  const heroKpiSc = km === sm ? `KPI & sửa chữa · ${F.month(km)}` : `KPI · ${F.month(km)} · Sửa chữa · ${F.month(sm)}`;

  return `${dshPeriod('ov')}
  <div class="dh dsh-hero">
    <div>
      <div class="dh-k">Trung tâm điều hành · ${F.date(D.today())}</div>
      <div class="dh-v">Toàn cảnh vận hành</div>
      <div class="dh-sub"><span class="pl-pill na">Báo cáo tổng hợp</span><span>${heroKpiSc} · Tiến độ ${F.month(pm)}</span></div>
      <div class="dh-st">
        <div><b>${F.num(K.js.length)}</b><span>Việc KPI</span></div>
        <div><b>${F.num(K.vol)}</b><span>Khối lượng quy đổi</span></div>
        <div><b>${F.pct(S.rate)}</b><span>Hoàn thành sửa chữa</span></div>
        <div><b>${F.pct(P.rate)}</b><span>Hoàn thành tiến độ</span></div>
      </div>
      <div class="dh-act">
        <button class="dhb" data-act="kpiImport">${ic('upload')} Nhập KPI</button>
        <button class="dhb" data-act="scImport">${ic('upload')} Nhập sửa chữa</button>
        <button class="dhb" data-act="pgImport">${ic('upload')} Nhập tiến độ</button>
      </div>
    </div>
    <div class="dh-ch">
      <div class="dh-ct"><span>Điểm KPI trung bình 6 tháng</span><span>Kỳ này <b>${F.num(K.avg)}</b></span></div>
      ${heroArea(months.map(F.mshort), tr.map(x => x.kpi ? x.avg : 0), v => 'Điểm KPI trung bình: ' + F.num(v) + ' / 100')}
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#bae6fd;padding:0 6px 4px"><span>Thang điểm 100</span><span>${K.K.length} nhân sự · ${F.num(K.js.length)} việc</span></div>
    </div>
    <div class="dh-ring">
      <svg viewBox="0 0 120 120">
        <defs><linearGradient id="ovR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#fde68a"/></linearGradient></defs>
        <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="11"/>
        <circle class="dring" cx="60" cy="60" r="50" fill="none" stroke="url(#ovR)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(C * pct / 100).toFixed(1)} 400" transform="rotate(-90 60 60)"/>
        <text x="60" y="60" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">${F.num(P.rate, 0)}%</text>
        <text x="60" y="78" text-anchor="middle" font-size="9.5" fill="#bae6fd">tiến độ hoàn thành</text>
      </svg>
      <b>${P.done} / ${P.total} việc đã xong</b><span>Tiến độ ${F.month(pm)}</span>
    </div>
  </div>

  <div class="dmn-grid">
    ${dshDomain({ c: DSH_C.kpi, cb: DSH_SOFT.kpi, icon: 'kanban', label: 'KPI & công việc', period: F.month(km), value: F.num(K.js.length), unit: 'công việc', sub: `<b>${F.num(K.vol)}</b> khối lượng · <b>${K.K.length}</b> nhân sự<br>Điểm KPI trung bình <b>${F.num(K.avg)}</b>`, data: tr.map(x => x.kpi), foot: `${K.centers.length} trung tâm · ${K.flags.ll} lỗi lặp`, tab: 'kpi' })}
    ${dshDomain({ c: DSH_C.sc, cb: DSH_SOFT.sc, icon: 'wrench', label: 'Hạng mục sửa chữa', period: F.month(sm), value: F.num(S.total), unit: 'hạng mục', sub: `Đã xong <b>${S.done}</b> (${F.pct(S.rate)}) · Cần xử lý <b>${S.open}</b><br>Chờ thiết bị <b>${S.waiting}</b> · Chưa cập nhật <b>${S.unupdated}</b>`, data: months.map(m => scOf(m).length), foot: `${S.centers} trung tâm · TB ${S.avgDays ? F.num(S.avgDays, 1) + ' ngày' : '—'}`, tab: 'sc' })}
    ${dshDomain({ c: DSH_C.pg, cb: DSH_SOFT.pg, icon: 'calcheck', label: 'Tiến độ công việc', period: F.month(pm), value: F.num(P.total), unit: 'công việc', sub: `Đã xong <b>${P.done}</b> (${F.pct(P.rate)}) · Còn <b>${P.open}</b><br>${P.weeks.length} tuần · ${projectItems.length} nhóm công việc`, data: pgMonths().map(m => pgStats(m).done), foot: `${P.list.filter(p => !p.nguoi).length} việc chưa phân công`, tab: 'pg' })}
    ${dshDomain({ c: DSH_C.hr, cb: DSH_SOFT.hr, icon: 'users', label: 'Nhân sự & lương', period: F.month(UI.m), value: F.num(H.staff), unit: 'nhân sự', sub: `Quỹ lương <b>${F.short(H.gross)}</b> · Thực lĩnh <b>${F.short(H.net)}</b><br>${H.paid} người hưởng lương kỳ này`, data: H.trend, foot: `${H.months} tháng chấm công`, tab: 'hr' })}
  </div>

  <div class="grid cols-21 mb">
    ${card('Nhịp vận hành 6 tháng', Chart.combo({
      labels: months.map(F.mshort),
      bars: [
        { name: 'Việc KPI', values: months.map(m => cvOf(m).length), color: '#0284c7' },
        { name: 'Hạng mục sửa chữa', values: months.map(m => scOf(m).length), color: '#f59e0b' }
      ],
      lines: [{ name: 'Điểm KPI TB', values: tr.map(x => x.avg), color: '#10b981' }],
      fmtL: v => F.short(v), fmtR: v => F.num(v, 0), tipFmt: v => F.num(v), h: 290
    }) + `<div class="dsh-note">${ic('alert')} Dữ liệu sửa chữa bắt đầu từ 07/2026; các tháng trước không phát sinh dữ liệu.</div>`, { sub: 'Cột: số lượng · Đường: điểm KPI trung bình' })}
    ${card('Trạng thái sửa chữa', Chart.donut({ items: S.statuses, center: F.num(S.total), centerSub: 'hạng mục', fmt: v => F.num(v) + ' mục' }) + `<div class="dsh-minis"><div class="dsh-mini"><span>Hoàn thành</span><b>${S.done}<small> / ${S.total}</small></b></div><div class="dsh-mini"><span>Chưa cập nhật</span><b>${S.unupdated}</b></div><div class="dsh-mini"><span>TB xử lý</span><b>${S.avgDays ? F.num(S.avgDays, 1) : '—'}<small> ngày</small></b></div></div>`, { sub: F.month(sm) })}
  </div>

  <div class="grid cols-21 mb">
    ${card('Tiến độ công việc', `<div class="dsh-split"><div>${Chart.gauge({ value: P.rate, max: 100, label: 'Tỷ lệ hoàn thành', sub: `${P.done} / ${P.total} công việc`, color: '#10b981' })}</div><div>${P.weeks.length ? Chart.bar({ labels: P.weeks.map(w => 'T' + w), series: [{ name: 'Hoàn thành', values: P.wk.map(x => x.done), color: '#10b981' }, { name: 'Chưa hoàn thành', values: P.wk.map(x => x.total - x.done), color: '#f43f5e' }], stacked: true, h: 210, fmt: v => F.num(v, 0), tipFmt: v => F.num(v) + ' việc' }) : '<div class="empty">Chưa có dữ liệu tuần</div>'}</div></div><div class="dsh-note">${ic('calcheck')} Theo dõi ${P.total} công việc trong ${F.month(pm)} · ${P.open} việc còn lại cần xử lý.</div>`, { sub: F.month(pm) })}
    ${card('Top trung tâm phát sinh', Chart.hbars({ items: S.centerRows.slice(0, 8).map(c => ({ label: c.label, value: c.total, sub: `${c.done} hoàn thành` })), fmt: v => F.num(v) + ' mục', color: 'linear-gradient(90deg,#fbbf24,#f97316)', empty: 'Chưa có dữ liệu sửa chữa' }), { sub: `Sửa chữa · ${F.month(sm)}` })}
  </div>

  <div class="grid cols-3">
    ${card('Xếp hạng KPI nhân sự', kpiTop.length ? kpiTop.map((m, i) => {
      const g = kGrade(m.tot), medal = ['#f59e0b', '#94a3b8', '#b45309'][i] || '#cbd5e1';
      return `<div class="tli"><span class="medal" style="background:${medal}">${i + 1}</span><span class="avatar">${F.initials(m.p)}</span><div class="grow"><b>${esc(m.p)}</b><small>${m.n} việc · ${F.num(m.kl)} KL</small><div class="pb"><i style="width:${Math.max(0, Math.min(100, m.tot))}%;background:linear-gradient(90deg,#7dd3fc,#0284c7)"></i></div></div><div class="v">${F.num(m.tot)}<small><span class="badge" style="background:#${g[1]};color:#${g[2]}">${g[0]}</span></small></div></div>`;
    }).join('') : '<div class="empty">Chưa có điểm KPI</div>', { sub: 'Thang điểm 100' })}
    ${card('Cảnh báo & việc cần làm', `<div class="dsh-alerts">${alerts.slice(0, 5).map(dshAlert).join('')}</div>`, { sub: 'Ưu tiên xử lý' })}
    ${card('Tiến độ theo nhóm dự án', Chart.hbars({ items: projectItems.map(p => ({ label: p.label, value: p.value, sub: `${p.done}/${p.value} hoàn thành` })), fmt: v => F.num(v) + ' việc', color: 'linear-gradient(90deg,#6ee7b7,#10b981)', empty: 'Chưa có dữ liệu tiến độ' }), { sub: `Tự phân loại · ${F.month(pm)}` })}
  </div>`;
}

/* ---------- Tab 2: KPI & công việc ---------- */
function dshKpiTab() {
  const km = viewMonth('kvm'), S = dshKpi(km), js = S.js;
  if (!js.length) return `${dshPeriod('kpi')}${dshEmptyCard(`Chưa có công việc KPI trong ${F.month(km)}`, 'kpiImport', 'Nhập báo cáo KPI')}`;
  const months = D.ymRange(km, 6);
  const tr = months.map(m => {
    const a = cvOf(m), k = kpiCalc(m);
    return { m, n: a.length, vol: sum(a, klOf), avg: k.length ? sum(k, x => x.tot) / k.length : 0 };
  });
  const heat = dshHeat(km, js);
  const cats = dshTopCats(S.cats.filter(c => c.value > 0));
  const gradeItems = DSH_GRADES.map(([g, c]) => ({ label: g, value: S.K.filter(m => kGrade(m.tot)[0] === g).length, color: c }));
  const top = S.K[0], bottom = S.K[S.K.length - 1];
  const flagged = js.filter(j => j.ll || j.vp || j.tn);
  const topTasks = [...js].sort((a, b) => klOf(b) - klOf(a)).slice(0, 5);
  const centerItems = S.centers.slice(0, 7);
  const head = [['Nhân sự'], ['Số việc', 'r'], ['Khối lượng', 'r'], ['Tỷ trọng', 'r'], ['Lỗi lặp', 'r'], ['Tự xử lý', 'r'], ['Điểm KPI', 'r'], ['Xếp loại', 'c']];
  const rows = S.K.map(m => {
    const g = kGrade(m.tot);
    return `<tr><td><div class="who"><span class="avatar">${F.initials(m.p)}</span><div><b>${esc(m.p)}</b><small>${m.cong == null ? 'Chưa có chấm công' : F.num(m.cong) + ' công · ' + F.num(m.nsuat) + ' KL/công'}</small></div></div></td><td class="r">${F.num(m.n)}</td><td class="r">${F.num(m.kl)}</td><td class="r">${pc(m.share * 100)}</td><td class="r ${m.ll ? 'neg' : ''}">${F.num(m.ll)}</td><td class="r">${pc(m.self * 100)}</td><td class="r"><b>${F.num(m.tot)}</b></td><td class="c"><span class="badge" style="background:#${g[1]};color:#${g[2]}">${g[0]}</span></td></tr>`;
  });
  const foot = `<tfoot><tr><td><b>Tổng / Trung bình</b></td><td class="r">${F.num(js.length)}</td><td class="r">${F.num(S.vol)}</td><td class="r">100%</td><td class="r">${F.num(S.flags.ll)}</td><td class="r">—</td><td class="r">${F.num(S.avg)}</td><td class="c">Thang 100</td></tr></tfoot>`;

  const flaggedHTML = flagged.length ? flagged.slice(0, 4).map(j => `<div class="dsh-alert bad"><span class="ai">${ic('alert')}</span><div class="grow"><b>${esc(j.ct || j.hm || 'Công việc')}</b><small>${F.date(j.th)} · ${esc(j.tt || '')} · ${esc(j.ng || '')} ${j.ll ? '<span class="badge b-red">Lỗi lặp</span>' : ''} ${j.vp ? '<span class="badge b-red">Vi phạm</span>' : ''} ${j.tn ? '<span class="badge b-amber">Thuê ngoài</span>' : ''}</small></div></div>`).join('') : `<div class="dsh-alert ok"><span class="ai">${ic('check')}</span><div class="grow"><b>Không ghi nhận lỗi lặp, vi phạm hoặc thuê ngoài</b><small>Tất cả ${js.length} công việc trong kỳ đều đạt yêu cầu ghi nhận.</small></div></div>`;

  return `${dshPeriod('kpi')}
  <div class="kpis">
    ${kpi({ label: 'Tổng công việc', value: F.num(js.length), sub: `${S.K.length} nhân sự · ${S.centers.length} trung tâm`, icon: 'kanban' })}
    ${kpi({ label: 'Khối lượng quy đổi', value: F.num(S.vol), sub: 'Hệ số × độ khó', icon: 'box', tone: 'blue' })}
    ${kpi({ label: 'KPI trung bình', value: F.num(S.avg), sub: 'Thang điểm 100', icon: 'trend', tone: 'green' })}
    ${kpi({ label: 'Lỗi lặp lại', value: F.num(S.flags.ll), sub: S.js.length ? `${F.pct(S.llRate)} tỷ lệ` : 'Không ghi nhận', icon: 'alert', tone: S.flags.ll ? 'red' : 'green' })}
    ${kpi({ label: 'Chi phí phát sinh', value: F.short(S.cp), sub: S.flags.tn ? `${S.flags.tn} việc thuê ngoài` : 'Không thuê ngoài', icon: 'money', tone: S.cp ? 'amber' : '' })}
  </div>
  <div class="grid cols-21 mb">
    ${card('Xu hướng công việc & KPI', Chart.combo({
      labels: months.map(F.mshort),
      bars: [
        { name: 'Số công việc', values: tr.map(x => x.n), color: '#0284c7' },
        { name: 'Khối lượng', values: tr.map(x => x.vol), color: '#7c3aed' }
      ],
      lines: [{ name: 'KPI trung bình', values: tr.map(x => x.avg), color: '#10b981' }],
      fmtL: v => F.short(v), fmtR: v => F.num(v, 0), tipFmt: v => F.num(v), h: 300
    }), { sub: '6 tháng gần nhất' })}
    ${card('Cơ cấu khối lượng theo hạng mục', Chart.donut({ items: cats.map((c, i) => ({ label: c.label, value: c.value, color: CRC[i % CRC.length] })), center: F.num(S.vol), centerSub: 'khối lượng', fmt: v => F.num(v) }) + `<div class="dsh-note">${ic('tag')} Hạng mục lấy từ nhật ký công việc, tổng hợp theo khối lượng quy đổi.</div>`, { sub: 'Theo hạng mục' })}
  </div>
  <div class="grid cols-2 mb">
    ${card('Hồ sơ điểm KPI theo tiêu chí', Chart.radar({
      axes: CRIT.map(([k, l, mx]) => ({ label: l, max: mx })),
      series: S.K.slice(0, 4).map((m, i) => ({ name: m.p, color: CRC[i], values: CRIT.map(([k]) => m.sc[k]) })), h: 360
    }), { sub: 'Điểm tối đa theo trọng số' })}
    ${card('Cơ cấu điểm theo nhân sự', Chart.bar({
      labels: S.K.map(m => m.p), stacked: true, h: 360,
      series: CRIT.map(([k, l], i) => ({ name: l, color: CRC[i], values: S.K.map(m => m.sc[k]) })),
      fmt: v => F.num(v, 0), tipFmt: v => F.num(v) + ' điểm'
    }), { sub: 'Tổng tối đa 100 điểm' })}
  </div>
  <div class="grid cols-21 mb">
    ${card('Mật độ công việc theo ngày', Chart.heatmap({ rows: heat.rows, cols: heat.cols, values: heat.vals, color: '#0284c7', fmt: v => F.num(v) }) + `<div class="dsh-note">${ic('calendar')} Mỗi ô là số công việc ghi nhận trong ngày; cột T2–CN.</div>`, { sub: F.month(km) })}
    ${card('Xếp loại KPI', Chart.donut({ items: gradeItems, center: F.num(S.K.length), centerSub: 'nhân sự', fmt: v => F.num(v) + ' người' }) + `<div class="dsh-kvs"><div class="dsh-kv"><span>Cao nhất</span><b>${top ? esc(top.p) + ' · ' + F.num(top.tot) : '—'}</b></div><div class="dsh-kv"><span>Thấp nhất</span><b>${bottom ? esc(bottom.p) + ' · ' + F.num(bottom.tot) : '—'}</b></div></div>`, { sub: 'Theo tổng điểm' })}
  </div>
  <div class="card mb"><div class="card-h"><h3>Bảng điểm KPI ${F.month(km)}</h3><span class="sub">Tự động từ nhật ký · có thể chấm tay trong mục KPI</span><div class="right"><button class="btn sm" data-act="kpiImport">${ic('upload')} Nhập báo cáo</button></div></div><div class="card-b p0">${tbl(head, rows, foot)}</div></div>
  <div class="grid cols-3">
    ${card('Chất lượng & tuân thủ', `<div class="dsh-kvs"><div class="dsh-kv"><span>Lỗi lặp lại</span><b class="${S.flags.ll ? 'neg' : 'pos'}">${S.flags.ll}</b></div><div class="dsh-kv"><span>Vi phạm nội quy</span><b class="${S.flags.vp ? 'neg' : 'pos'}">${S.flags.vp}</b></div><div class="dsh-kv"><span>Thuê ngoài</span><b>${S.flags.tn}</b></div><div class="dsh-kv"><span>Chi phí phát sinh</span><b>${F.short(S.cp)}</b></div></div><div style="margin-top:10px">${flaggedHTML}</div>`, { sub: `${F.month(km)}` })}
    ${card('Khối lượng theo trung tâm', Chart.hbars({ items: centerItems.map(c => ({ label: c.label, value: c.value, sub: `${c.n} việc` })), fmt: v => F.num(v), color: 'linear-gradient(90deg,#7dd3fc,#0284c7)', empty: 'Chưa có dữ liệu' }), { sub: 'Theo khối lượng quy đổi' })}
    ${card('Top công việc khối lượng lớn', topTasks.length ? topTasks.map((j, i) => `<div class="tli"><span class="medal" style="background:#f1f5f9;color:#475467">${i + 1}</span><div class="grow"><b>${esc(j.ct || j.hm)}</b><small>${F.date(j.th)} · ${esc(j.tt || '')} · ${esc(j.ng || '')}</small></div><div class="v">${F.num(klOf(j))}<small>KL</small></div></div>`).join('') : '<div class="empty">Chưa có dữ liệu</div>', { sub: F.month(km) })}
  </div>`;
}

/* ---------- Tab 3: Sửa chữa ---------- */
function dshScTab() {
  const sm = viewMonth('scm'), S = dshSc(sm);
  if (!S.total) return `${dshPeriod('sc')}${dshEmptyCard(`Chưa có hạng mục sửa chữa trong ${F.month(sm)}`, 'scImport', 'Nhập hạng mục sửa chữa')}`;
  const statusItems = S.statuses.filter(x => x.value > 0);
  const cats = S.cats.slice(0, 8);
  const centerHead = [['Trung tâm'], ['Tổng', 'r'], ['Hoàn thành', 'r'], ['Chưa xong', 'r'], ['Tỷ lệ', 'r'], ['Số lượng', 'r']];

  </div>
  <div class="grid cols-3 mb">
    ${card('Tỷ lệ hoàn thành', Chart.gauge({ value: P.rate, max: 100, label: 'Công việc đã xong', sub: `${P.done} / ${P.total} công việc`, color: '#10b981' }) + `<div class="dsh-minis"><div class="dsh-mini"><span>Hoàn thành</span><b>${P.done}</b></div><div class="dsh-mini"><span>Còn lại</span><b>${P.open}</b></div><div class="dsh-mini"><span>Đang làm</span><b>${P.doing}</b></div></div>`, { sub: F.month(pm) })}
    ${card('Trạng thái công việc', Chart.donut({ items: statusItems, center: F.num(P.total), centerSub: 'công việc', fmt: v => F.num(v) + ' việc' }), { sub: F.month(pm) })}

}

        actions: p => `<button class="ibtn" data-act="pgToggle" data-id="${p.id}" data-tip="${pgStatus(p) === 'Hoàn thành' ? 'Chuyển về chưa hoàn thành' : 'Đánh dấu hoàn thành'}">${ic(pgStatus(p) === 'Hoàn thành' ? 'x' : 'check')}</button>${rowBtns(p.id, 'pgEdit', 'pgDel')}`,
        searchText: p => `${p.nhom || ''} ${pgProject(p)}`,
        empty: 'Không có công việc phù hợp bộ lọc.',
        columns: [
          { key: 'ngay', label: 'Ngày', fmt: 'date', w: '92px' },
          { key: 'tuan', label: 'Tuần', align: 'c', val: p => 'T' + (+p.tuan || 1) },
          { key: 'ten', label: 'Tên công việc', cls: 'wrap', w: '360px' },
          { key: 'nhom', label: 'Nhóm / dự án', render: p => esc(p.nhom || pgProject(p)), val: p => p.nhom || pgProject(p) },
          { key: 'tt', label: 'Trạng thái', render: p => pgBadge(pgStatus(p)), val: p => pgStatus(p) },
          { key: 'nguoi', label: 'Phụ trách', render: p => p.nguoi ? esc(p.nguoi) : '<span class="muted">Chưa phân công</span>', val: p => p.nguoi || '' },
          { key: 'ut', label: 'Ưu tiên', align: 'c', render: p => !p.ut ? '<span class="muted">—</span>' : `<span class="badge ${p.ut === 'Cao' ? 'b-red' : p.ut === 'Thấp' ? 'b-green' : 'b-blue'}">${esc(p.ut)}</span>` },
          { key: 'gc', label: 'Ghi chú', cls: 'wrap', w: '200px' }
        ],
        tools
      });
      onVal('pgStatusF', v => { UI.pgs = v; UI.tbl.pgDash && (UI.tbl.pgDash.page = 0); App.render(); });
      onVal('pgProjectF', v => { UI.pgp = v; UI.tbl.pgDash && (UI.tbl.pgDash.page = 0); App.render(); });
    }
    if (t === 'hr') bindMonth();
  },
  render(el) {
    const t = UI.dtab || 'ov';
    if (t === 'hr') {
      el.innerHTML = `<div class="dsh">${dshTabs('hr')}${dshPeriod('hr')}<div id="hrDash"></div></div>`;
      vDash.render($('#hrDash', el));
      return;
    }
    App.subtitle = t === 'kpi' ? F.month(viewMonth('kvm')) : t === 'sc' ? F.month(viewMonth('scm')) : t === 'pg' ? F.month(pgMonth()) : 'Toàn cảnh vận hành';
    const body = t === 'kpi' ? dshKpiTab() : t === 'sc' ? dshScTab() : t === 'pg' ? dshPgTab() : dshOverview();
    el.innerHTML = `<div class="dsh">${dshTabs(t)}${body}</div>`;
    if (t === 'ov') countUp(el);
  },
  excel() {
    const t = UI.dtab || 'ov';
    if (t === 'hr') return vDash.excel();
    const km = viewMonth('kvm'), sm = viewMonth('scm'), pm = pgMonth();
    if (t === 'kpi') return XLSX.save('Bao cao KPI dieu hanh ' + km, dshKpiSheets(km));
    if (t === 'sc') return XLSX.save('Bao cao sua chua dieu hanh ' + sm, dshScSheets(sm));
    if (t === 'pg') return XLSX.save('Bao cao tien do ' + pm, dshPgSheets(pm));
    const K = dshKpi(km), S = dshSc(sm), P = pgStats(pm), H = dshHR();
    const sumRows = [
      { domain: 'KPI & công việc', period: F.month(km), total: K.js.length, done: '', rate: '', note: `${K.K.length} nhân sự · ${F.num(K.vol)} khối lượng · KPI TB ${F.num(K.avg)}` },
      { domain: 'Hạng mục sửa chữa', period: F.month(sm), total: S.total, done: S.done, rate: S.rate, note: `${S.open} cần xử lý · TB ${S.avgDays ? F.num(S.avgDays, 1) + ' ngày' : '—'}` },
      { domain: 'Tiến độ công việc', period: F.month(pm), total: P.total, done: P.done, rate: P.rate, note: `${P.open} chưa xong · ${P.weeks.length} tuần` },
      { domain: 'Nhân sự & lương', period: F.month(UI.m), total: H.staff, done: '', rate: '', note: `Quỹ lương ${F.short(H.gross)} · thực lĩnh ${F.short(H.net)}` }
    ];
    XLSX.save('Bao cao dieu hanh ' + km, [
      xSheet('Tổng quan', 'BÁO CÁO ĐIỀU HÀNH TỔNG QUAN', [{ label: 'Phân hệ', key: 'domain', width: 24 }, { label: 'Kỳ dữ liệu', key: 'period' }, { label: 'Tổng số', key: 'total', type: 'num', sum: true }, { label: 'Hoàn thành', key: 'done', type: 'num', sum: true }, { label: 'Tỷ lệ (%)', key: 'rate', type: 'num' }, { label: 'Ghi chú', key: 'note', width: 48 }], sumRows),
      ...dshKpiSheets(km), ...dshScSheets(sm), ...dshPgSheets(pm)
    ]);
  }
};
ACT.dshTab = d => { UI.dtab = d.k; App.render(); };

/* ---------- Khởi động ---------- */
App.init({
  id: 'luong', title: 'Chấm công & Tính lương', tagline: 'Chấm công · Lương · KPI · Sửa chữa · Tiến độ', icon: 'wallet', fileName: 'Cham_cong_Tinh_luong_KPI_Sua_chua_2026.html', theme: THEME,
  palette: ['#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#06b6d4', '#ec4899', '#64748b'],
  sample: sampleDB, empty: emptyDB, migrate,
  counts: () => [['Nhân viên', DB.employees.length], ['Tháng có chấm công', Object.keys(DB.cham).length], ['Công việc đã ghi', (DB.cv || []).length], ['Hạng mục sửa chữa', (DB.repairs || []).length], ['Công việc tiến độ', (DB.progress || []).length]],
  nav: [{ group: 'Tổng quan', items: ['dashboard'] }, { group: 'Nghiệp vụ', items: ['nhanvien', 'chamcong', 'congviec', 'kpicv', 'suachua', 'baocao', 'bangluong', 'thue'] }, { group: 'Thiết lập', items: ['danhmuc', 'caidat'] }],
  views: { dashboard: vBoard, nhanvien: vEmp, chamcong: vCham, congviec: vCV, kpicv: vKP, suachua: vSC, danhmuc: vDM, baocao: vBC, bangluong: vLuong, thue: vThue, caidat: vSet }
});


</script>
